services:
  postgres:
    image: postgres:16-alpine
    container_name: antrina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: antrina
      POSTGRES_PASSWORD: antrina
      POSTGRES_DB: antrina
    ports:
      - '5433:5432'
    volumes:
      - antrina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U antrina -d antrina']
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento de fotos S3-compatible (en producción: Cloudflare R2).
  minio:
    image: minio/minio:latest
    container_name: antrina-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: antrina
      MINIO_ROOT_PASSWORD: antrina-dev-secret
      # El panel sube con PUT firmado desde el navegador y la tienda lee las fotos.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5174,http://localhost:4321
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - antrina-media:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea el bucket con lectura pública (las fotos de producto son públicas; la escritura solo con URL firmada).
  minio-init:
    image: minio/mc:latest
    container_name: antrina-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 antrina antrina-dev-secret &&
      mc mb --ignore-existing local/antrina-media &&
      mc anonymous set download local/antrina-media
      "
    restart: 'no'

volumes:
  antrina-pgdata:
  antrina-media:
